name: Human action
description: Human-only decision, credential, permission, or policy request.
title: "[Human] "
labels: ["human-action"]
body:
  - type: markdown
    attributes:
      value: |
        This Issue is an auxiliary interaction surface. Canonical state remains under company/state.
  - type: input
    id: canonical
    attributes:
      label: Canonical state file
      placeholder: company/state/work-items/wi-123.json
    validations:
      required: true
  - type: textarea
    id: action
    attributes:
      label: Requested human action
    validations:
      required: true
