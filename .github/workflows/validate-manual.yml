name: Validate Agents Company

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run validate
      - run: node --check panel.js
      - run: node --check packages/core/src/index.mjs
      - run: node --check packages/core/src/validate.mjs
